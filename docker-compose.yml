version: '3.8'

services:
  api:
    build: .
    container_name: claim-parser-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - WORKER_COUNT=${WORKER_COUNT:-4}
      - LOGGING_LEVEL=${LOGGING_LEVEL:-INFO}
